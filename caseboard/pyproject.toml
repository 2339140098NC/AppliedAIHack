[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caseboard"
version = "0.1.0"
description = "Proximate, a case workspace for the Sapini file."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "upstash-redis>=1.2",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["caseboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "caseboard.main:app"
