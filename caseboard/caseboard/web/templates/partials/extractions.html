{% if not extractions %}
<p class="empty">No PDFs yet. Sync Clio to list the matter's files.</p>
{% else %}
<ul class="extract-list">
  {% for item in extractions %}
  <li class="extract-row">
    <div class="extract-copy">
      <div class="event-label">{{ item.title }}</div>
      <div class="event-sub">{{ item.filename }}</div>
      <div class="extract-meta">
        <span class="tag {% if item.state == 'stale' %}conflict{% elif item.state == 'done' %}tag-accent{% else %}tag-outline{% endif %}">{{ item.label }}</span>
        {% if item.when %}<span class="event-src">{{ item.when }}</span>{% endif %}
      </div>
    </div>
    <div class="extract-actions">
      <a class="btn btn-secondary" href="{{ item.extract_href }}" hx-get="/partials/drawer{{ item.extract_href[1:] }}" hx-target="#drawer-panel" hx-swap="innerHTML" hx-push-url="{{ item.extract_href }}">Extracted</a>
      <a class="btn btn-secondary" href="{{ item.href }}" hx-get="/partials/drawer{{ item.href[1:] }}" hx-target="#drawer-panel" hx-swap="innerHTML" hx-push-url="{{ item.href }}">Open</a>
      <form hx-post="/actions/reextract" hx-target="#status" hx-swap="innerHTML">
        <input type="hidden" name="filename" value="{{ item.filename }}">
        <button class="btn btn-secondary" type="submit" {% if job.running %}disabled{% endif %}>Re-extract</button>
      </form>
    </div>
  </li>
  {% endfor %}
</ul>
{% endif %}
